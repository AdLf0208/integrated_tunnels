id = "integratedtunnels"
name = "Integrated Tunnels"
version = "0.2.3"
description = """A port of Integrated Tunnels for Horizon: an Item Importer part on a tunnel cable
face pulls items out of the inventory behind that face into the cable network's item store, and an
Item Exporter part hands them on into the inventory behind its own face; a Fluid Importer and a
Fluid Exporter do the same on the network's fluid channel. The parts, the carrier block, the
per-tick network pass and the /integratedtunnels readout are one package, so a single .hmod
installs both halves."""
authors = ["rubensworks (aka kroeser)", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: the cable is placed and ticked by an
# integrated server, which belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod does add a block, two items and a block entity type, and the manifest's shape
# is not negotiable.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
